services:
  mongodb:
    image: mongo:7.0
    container_name: recon-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: recon_dev
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: recon-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
